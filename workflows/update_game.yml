name: Update Tic-Tac-Toe Game
on:
  workflow_dispatch:
    inputs:
      move:
        description: 'Cell number (0-8) for player move or "reset" to reset the game'
        required: true
jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run Tic-Tac-Toe script
        env:
          MOVE: ${{ github.event.inputs.move }}
        run: python tic_tac_toe.py
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Update Tic-Tac-Toe game state
