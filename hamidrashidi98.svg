  <text text-anchor="middle" alignment-baseline="middle" x="50%" y="50%" class="text" style="fill:url(#gradient); stroke:#FFFFFF; stroke-width:2; stroke-opacity:0.5;" stroke-linejoin="round">Hamid Rashidi</text>
